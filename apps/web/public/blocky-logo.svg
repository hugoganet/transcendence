<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Body: teal block -->
  <rect x="20" y="25" width="70" height="65" rx="12" fill="#2B9E9E"/>
  <rect x="20" y="25" width="70" height="65" rx="12" fill="url(#bodyGrad)"/>

  <!-- Eyes -->
  <ellipse cx="43" cy="52" rx="11" ry="12" fill="white"/>
  <ellipse cx="67" cy="52" rx="11" ry="12" fill="white"/>
  <circle cx="46" cy="53" r="5" fill="#2B2522"/>
  <circle cx="70" cy="53" r="5" fill="#2B2522"/>
  <circle cx="48" cy="51" r="1.8" fill="white"/>
  <circle cx="72" cy="51" r="1.8" fill="white"/>

  <!-- Beak -->
  <polygon points="55,62 60,68 65,62" fill="#D4A843"/>

  <!-- Blush -->
  <ellipse cx="35" cy="63" rx="5" ry="3" fill="#FF9999" opacity="0.4"/>
  <ellipse cx="75" cy="63" rx="5" ry="3" fill="#FF9999" opacity="0.4"/>

  <!-- Wing -->
  <path d="M90 45 C105 42, 108 55, 95 65 C88 70, 88 58, 90 50Z" fill="#248585"/>

  <!-- Legs -->
  <rect x="40" y="88" width="5" height="12" rx="2.5" fill="#248585"/>
  <rect x="60" y="88" width="5" height="12" rx="2.5" fill="#248585"/>

  <!-- Chain link (left hand) -->
  <g transform="translate(10, 55)">
    <ellipse cx="8" cy="8" rx="7" ry="9" stroke="#D4A843" stroke-width="3" fill="none"/>
    <ellipse cx="8" cy="22" rx="7" ry="9" stroke="#D4A843" stroke-width="3" fill="none"/>
  </g>

  <!-- Eyebrows -->
  <path d="M34 42 Q40 38 50 41" stroke="#1D6B6B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M60 41 Q70 38 76 42" stroke="#1D6B6B" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Feather texture on chest -->
  <path d="M40 72 Q55 78 70 72" stroke="#248585" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M43 76 Q55 81 67 76" stroke="#248585" stroke-width="1.5" fill="none" opacity="0.4"/>

  <defs>
    <linearGradient id="bodyGrad" x1="20" y1="25" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
